<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>拾影 · 照片分類 sample</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="./">◈ 拾影 <small>PHOTO NOTES</small></a><span class="badge">互動 SAMPLE</span></header>
<main><section class="intro"><div class="eyebrow">一張照片，一段記錄。</div><h1>把眼前的片刻，<br>好好收藏。</h1><p>選一張照片、寫下說明，再替它找到適合的分類。</p></section>
<section class="workspace"><form id="form"><div class="section-title"><h2>新增照片</h2><span>01 — CREATE</span></div><label class="upload" id="drop"><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" required><img id="preview" alt="選取照片的預覽" hidden><div id="uploadHint"><b class="plus">＋</b><strong>點擊選擇或拖曳照片</strong><span>每次一張 · JPG / PNG / WebP · 最大 10 MB</span></div></label><div id="fileName" class="hint">尚未選擇照片</div>
<label class="field" for="description">照片說明 <em>必填</em></label><textarea id="description" rows="3" maxlength="500" placeholder="這張照片記錄了什麼？" required></textarea><div class="counter"><span id="count">0</span> / 500</div>
<label class="field" for="level1">照片分類 <em>三層皆必填</em></label><div class="categories"><div><label for="level1">第一層</label><select id="level1" required><option value="">選擇大類</option></select></div><div><label for="level2">第二層</label><select id="level2" required disabled><option value="">先選第一層</option></select></div><div><label for="level3">第三層</label><select id="level3" required disabled><option value="">先選第二層</option></select></div></div><p id="path" class="hint">依序選擇，完成照片的分類路徑。</p><button id="save" class="primary" type="submit">儲存這張照片 <span>↗</span></button><p id="status" role="status" aria-live="polite"></p></form>
<aside><div class="section-title"><h2>我的收藏 <span id="total">0</span></h2><span>02 — COLLECTION</span></div><p class="local-note">此 sample 存於目前瀏覽器，不會上傳到伺服器。</p><div id="gallery"><div class="empty"><span>▧</span><h3>第一張，從這裡開始。</h3><p>完成左側表單後，照片會出現在這裡。</p></div></div></aside></section><footer>拾影 / PHOTO NOTES<span>簡單記錄，慢慢收藏。</span></footer></main><script src="app.js"></script></body></html>
